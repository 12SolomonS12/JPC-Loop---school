<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page metadata and stylesheet. -->
    <title>Gallery | JPC Loop</title>
    <link rel="stylesheet" href="../style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<script src="../js/gallery.js" defer></script>

<body class="gallery">

    <!-- Header navigation shown at the top of the gallery page. -->
    <header>
        <nav class="navbar">
            <h2 class="logo"><a href="home.html"><img src="../images/jpcLoopLogo.png" alt="JPC Loop"></a></h2>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="feed.html">Feed</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="houses.html">Houses</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="guidelines.html">Guidelines</a></li>
                <li><a class="signin" href="signin.html">Sign in</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main gallery page content. -->
    <main class="page-main">
        <section class="page-heading">
            <h1>Gallery</h1>
        </section>

        <div class="gallery-grid">

            <section class="photo-gallery" data-gallery="juniors">
                <h2>Juniors</h2>

                <div class="gallery-viewer" id="juniors-viewer">
                    <img src="../images/gallery/juniors/junior1.jfif" alt="Juniors photo 1">
                    <img src="../images/gallery/juniors/junior2.jfif" alt="Juniors photo 2">
                    <img src="../images/gallery/juniors/junior3.jfif" alt="Juniors photo 3">

                    <button class="gallery-arrow-prev" type="button" aria-label="Previous junior image">
                        &lt;
                    </button>

                    <button class="gallery-arrow-next" type="button" aria-label="Next junior image">
                        &gt;
                    </button>
                    
                    <div class="gallery-thumbnails">
                        
                    </div>
                </div>
            </section>

            <section class="photo-gallery" data-gallery="seniors">
                <h2>Seniors</h2>

                <div class="gallery-viewer" id="seniors-viewer">
                    <img src="../images/gallery/seniors/senior1.jfif" alt="Seniors photo 1">
                    <img src="../images/gallery/seniors/senior2.jfif" alt="Seniors photo 2">
                    <img src="../images/gallery/seniors/senior3.jfif" alt="Seniors photo 3">

                    <button class="gallery-arrow-prev" type="button" aria-label="Previous senior image">
                        &lt;
                    </button>

                    <button class="gallery-arrow-next" type="button" aria-label="Next senior image">
                        &gt;
                    </button>
                    
                    <div class="gallery-thumbnails">
                        
                    </div>
                </div>
            </section>
        </div>
    </main>

<script type="module" src="../js/navAuth.js"></script>
</body>
</html>
